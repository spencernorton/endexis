[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "endexis"
version = "2.2.1"
description = "Endexis — Tenant-Agnostic Clinical & Financial Analytics, DA2, V500, CCL, and BIRT 4.4.2 Compiler"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Endexis Contributors"}]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0"]

[project.scripts]
endexis = "discern_intelligence.cli:main"
discern-iq = "discern_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
discern_intelligence = ["data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
