[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "endexis"
version = "2.0.0"
description = "Local SQL, CCL and report compiler for Oracle Health and Cerner Millennium analytics"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Endexis Contributors"}]
dependencies = ["pydantic>=2.0"]

[project.optional-dependencies]
test = ["pytest>=8.0"]
dev = ["pytest>=8.0"]

[project.urls]
Repository = "https://github.com/spencernorton/endexis"
Documentation = "https://github.com/spencernorton/endexis/blob/main/docs/compiler-reference.md"
Releases = "https://github.com/spencernorton/endexis/releases"
"Model weights" = "https://huggingface.co/NorviTech/endexis-qwen3-0.6b-dpo-merged"

[project.scripts]
endexis = "discern_intelligence.cli:main"
discern-iq = "discern_intelligence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
discern_intelligence = ["data/*.json", "data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
